# Config ohne Display – darf durch den Editor nie einen lvgl:-Block bekommen.
esphome:
  name: sensor-node

esp32:
  board: esp32dev

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: dht
    pin: GPIO4
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
